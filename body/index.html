<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:;">
<title>Moss</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; user-select: none; }
  canvas { display: block; }
  #bubble {
    position: absolute; left: 0; bottom: 0; max-width: 310px; padding: 8px 12px;
    background: rgba(255,255,255,.95); color: #23262b; border-radius: 14px;
    font: 15px/1.35 "Segoe UI", system-ui, sans-serif; box-shadow: 0 2px 10px rgba(0,0,0,.25);
    pointer-events: none; opacity: 0; transition: opacity .25s; white-space: pre-wrap;
  }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px;
    border: 7px solid transparent; border-bottom: 0; border-top-color: rgba(255,255,255,.95);
  }
  #bubble.show { opacity: 1; }
  #bubble .heard { font-size: 12px; color: #7a808a; font-style: italic; margin-bottom: 3px; }
  #bubble .heard:empty { display: none; }
  #bubble .dots span { display: inline-block; animation: hop 1s infinite; font-weight: 700; }
  #bubble .dots span:nth-child(2) { animation-delay: .15s; } #bubble .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
  #zzz { position: absolute; font: 700 22px "Segoe UI", sans-serif; color: #e8efff; text-shadow: 0 0 6px #4a6aa8;
         pointer-events: none; opacity: 0; transition: opacity .6s; }
  #zzz.show { opacity: .9; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(6px,-10px); } }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="bubble"><div class="heard"></div><div class="said"></div></div>
  <div id="zzz">z z Z</div>
  <script src="dist/renderer.bundle.js"></script>
</body>
</html>
